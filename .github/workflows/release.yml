name: Release

# Push a tag like v0.2.0 to publish a release (see CONTRIBUTING.md → Releasing).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Tag matches package.json and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p 'require("./package.json").version')
          if [ "$version" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package.json version ($package)."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ $version == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, args: "--mac dmg", files: "release/*.dmg" }
          - { os: windows-latest, args: "--win nsis", files: "release/*.exe" }
          - { os: ubuntu-latest, args: "--linux AppImage", files: "release/*.AppImage" }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package (Apple silicon and Intel, or x64 and arm64)
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
          # Optional repository secrets for macOS. With MAC_CERTIFICATE (a base64 Developer ID .p12)
          # the app is signed; with the APPLE_* ones too it's notarized. Without them it's signed ad hoc.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          # shellcheck disable=SC2086
          pnpm exec electron-builder $ARGS --x64 --arm64 --publish never
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          MAC_SIGNED: ${{ secrets.MAC_CERTIFICATE != '' }}
        run: |
          # This version's CHANGELOG.md section, without its heading or the link definitions at the end.
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Install

          | | Apple silicon / ARM | Intel / AMD |
          | --- | --- | --- |
          | **macOS** | \`Teamlet-$VERSION-arm64.dmg\` | \`Teamlet-$VERSION-x64.dmg\` |
          | **Windows** | \`Teamlet-$VERSION-arm64-setup.exe\` | \`Teamlet-$VERSION-x64-setup.exe\` |
          | **Linux** | \`Teamlet-$VERSION-arm64.AppImage\` | \`Teamlet-$VERSION-x64.AppImage\` |

          The apps need the \`claude\` and/or \`codex\` CLI installed and signed in; see the [README](https://github.com/$GITHUB_REPOSITORY#readme).

          - **Windows**: the installer isn't code-signed yet, so SmartScreen may warn. Choose **More info → Run anyway**.
          - **Linux**: \`chmod +x\` the AppImage, then run it. It needs FUSE 2 (\`libfuse2\`, or \`libfuse2t64\` on Ubuntu 24.04).
          EOF
          if [ "$MAC_SIGNED" != true ]; then
            echo "- **macOS**: this build isn't notarized. After copying it to Applications, run \`xattr -dr com.apple.quarantine /Applications/Teamlet.app\` once." >> notes.md
          fi
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Teamlet $VERSION" --notes-file notes.md "${flags[@]}"
