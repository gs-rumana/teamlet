name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Node (package.json engines) and the one the desktop app and releases use.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Boots the server and checks origin/CSRF rules, DNS-rebinding protection and sign-in.
      - run: pnpm test

  desktop:
    name: Desktop app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package (unsigned)
        run: pnpm exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Packaged app starts its server
        run: |
          app=$(ls -d release/mac*/Teamlet.app | head -1)
          TEAMLET_DATA_DIR="$RUNNER_TEMP/teamlet" "$app/Contents/MacOS/Teamlet" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4327/healthz; then kill "$pid"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/app.log" ~/Library/Logs/Teamlet/server.log || true
          exit 1

