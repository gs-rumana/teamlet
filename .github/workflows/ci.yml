name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Node (package.json engines), then the one releases ship with.
          - { os: ubuntu-latest, node: "22.18" }
          - { os: ubuntu-latest, node: "24" }
          - { os: windows-latest, node: "24" }
          - { os: macos-latest, node: "24" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Boots the server and checks origin/CSRF rules and DNS-rebinding protection.
      - run: pnpm test

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package (unsigned)
        run: pnpm exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Packaged app starts its server
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) app=(release/mac*/Teamlet.app/Contents/MacOS/Teamlet) ;;
            Windows) app=(release/win-unpacked/Teamlet.exe) ;;
            # No display on Linux runners; the unpacked app's sandbox helper isn't set up either.
            Linux) app=(xvfb-run --auto-servernum release/linux-unpacked/teamlet --no-sandbox) ;;
          esac
          TEAMLET_DATA_DIR="$RUNNER_TEMP/teamlet" "${app[@]}" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4327/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/app.log" || true
          cat ~/Library/Logs/Teamlet/server.log "$APPDATA/Teamlet/logs/server.log" ~/.config/Teamlet/logs/server.log 2>/dev/null || true
          exit 1
