name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Server boots and answers health checks
        run: |
          TEAMLET_DATA_DIR="$RUNNER_TEMP/mw" node server/index.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4317/healthz && exit 0; sleep 1; done
          exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: teamlet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
